services:
  backend:
    # Prebuilt images must be built with the same MAHJONG_ENABLE_SPECTATOR value.
    # This runtime variable documents the selected deployment mode; it cannot add compiled-out code.
    image: ${BACKEND_IMAGE:-mahjong-backend:latest}
    restart: unless-stopped
    environment:
      MAHJONG_DATABASE_URL: ${MAHJONG_DATABASE_URL:-sqlite+pysqlite:////data/mahjong.db}
      MAHJONG_ENABLE_SPECTATOR: ${MAHJONG_ENABLE_SPECTATOR:-false}
      MAHJONG_BOT_POLICY: ${MAHJONG_BOT_POLICY:-neural}
      MAHJONG_BOT_MODEL_PATH: ${MAHJONG_BOT_MODEL_PATH:-/app/assets/models/mahjong_policy_net.onnx}
      MAHJONG_BOT_NEURAL_WEIGHT: ${MAHJONG_BOT_NEURAL_WEIGHT:-15}
      MAHJONG_BOT_STRENGTH: ${MAHJONG_BOT_STRENGTH:-strong}
    volumes:
      - mahjong-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    # Prebuilt images must be built with the same MAHJONG_ENABLE_SPECTATOR value.
    # This runtime variable documents the selected deployment mode; it cannot add compiled-out code.
    image: ${FRONTEND_IMAGE:-mahjong-frontend:latest}
    restart: unless-stopped
    environment:
      MAHJONG_ENABLE_SPECTATOR: ${MAHJONG_ENABLE_SPECTATOR:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mahjong-data:
