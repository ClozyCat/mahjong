services:
  backend:
    image: ${BACKEND_IMAGE:-mahjong-backend:latest}
    restart: unless-stopped
    environment:
      MAHJONG_DATABASE_URL: ${MAHJONG_DATABASE_URL:-sqlite+pysqlite:////data/mahjong.db}
      MAHJONG_BOT_POLICY: ${MAHJONG_BOT_POLICY:-neural}
      MAHJONG_BOT_MODEL_PATH: ${MAHJONG_BOT_MODEL_PATH:-/app/assets/backup_model/backup.onnx}
      MAHJONG_BOT_STRENGTH: ${MAHJONG_BOT_STRENGTH:-strong}
    volumes:
      - type: bind
        source: ${MAHJONG_DATA_DIR:-/opt/mahjong-data}
        target: /data
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-mahjong-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
