<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tile Compare</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .row { display: flex; gap: 24px; align-items: flex-start; }
    .tile { width: 148px; }
    .frame { width: 148px; height: 232px; border: 1px solid #999; background: #fffdfa; display: grid; place-items: center; overflow: hidden; }
    img { width: 100%; height: 100%; object-fit: contain; object-position: center 42%; display: block; }
    pre { font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="row">
    <div class="tile"><div class="frame"><img id="east"></div><pre id="east-out">loading...</pre></div>
    <div class="tile"><div class="frame"><img id="fa"></div><pre id="fa-out">loading...</pre></div>
    <div class="tile"><div class="frame"><img id="zhong"></div><pre id="zhong-out">loading...</pre></div>
  </div>
  <script>
    const SVG_VIEWBOX = '0 0 320 446';

    function normalizeSvgMarkup(svgText) {
      return svgText.replace(/<svg\b([^>]*)>/i, (match, attributes) => {
        let nextAttributes = attributes;
        if (!/viewBox=/i.test(nextAttributes)) {
          nextAttributes += ` viewBox="${SVG_VIEWBOX}"`;
        }
        if (!/preserveAspectRatio=/i.test(nextAttributes)) {
          nextAttributes += ' preserveAspectRatio="xMidYMid meet"';
        }
        return `<svg${nextAttributes}>`;
      });
    }

    async function setImage(id, file) {
      const svgText = await fetch(`../../../frontend/images/${file}`).then((response) => response.text());
      const normalized = normalizeSvgMarkup(svgText);
      document.getElementById(id).src = `data:image/svg+xml,${encodeURIComponent(normalized)}`;
    }

    function bboxFromImage(img) {
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 446;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      for (let py = 0; py < canvas.height; py += 1) {
        for (let px = 0; px < canvas.width; px += 1) {
          const idx = (py * canvas.width + px) * 4;
          const a = data[idx + 3];
          if (a === 0) continue;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          if (r > 250 && g > 250 && b > 250) continue;
          if (px < minX) minX = px;
          if (py < minY) minY = py;
          if (px > maxX) maxX = px;
          if (py > maxY) maxY = py;
        }
      }
      return {
        naturalWidth: img.naturalWidth,
        naturalHeight: img.naturalHeight,
        bbox: maxX >= 0 ? { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 } : null,
      };
    }

    async function loadImage(img) {
      if (img.complete && img.naturalWidth > 0) return;
      await new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = reject;
      });
    }

    async function run() {
      await Promise.all([
        setImage('east', 'east.svg'),
        setImage('fa', 'fa.svg'),
        setImage('zhong', 'zhong.svg'),
      ]);

      const ids = ['east', 'fa', 'zhong'];
      await Promise.all(ids.map((id) => loadImage(document.getElementById(id))));

      for (const id of ids) {
        const result = bboxFromImage(document.getElementById(id));
        document.getElementById(id + '-out').textContent = JSON.stringify(result, null, 2);
      }
    }
    run().catch((error) => {
      document.body.insertAdjacentHTML('beforeend', '<pre id="error">' + String(error) + '</pre>');
    });
  </script>
</body>
</html>
