<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, landscape">
<title>新中式雅奢 - 几何极简麻将UI</title>
<style>
    :root {
        /* 绢丝水墨背景保持不变 */
        --table-bg: 
            radial-gradient(circle at 15% 20%, rgba(121, 137, 146, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(140, 150, 155, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #F9F9F7 0%, #EAEAE4 100%);
        --silk-texture: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.04"/></svg>');

        /* 配色进一步克制：降低饱和度，突出线条 */
        --gold: #B8975E; 
        --ink-dark: #2C3539; 
        --cinnabar: #9A3B2A; /* 朱砂红用于点缀 */
        --jade: #365B48;     /* 黛绿用于条子 */
        --tile-bg: linear-gradient(180deg, #FFFFFF 0%, #F6F6F3 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif; /* 强调现代无衬线字体 */
        background-color: #F9F9F7;
        background-image: var(--silk-texture), var(--table-bg); 
        height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
    }

    /* 底部手牌区 */
    .hand-tiles { display: flex; justify-content: center; align-items: flex-end; padding-bottom: 25px; gap: 4px; height: 100vh; }
    
    /* 牌体设计：更修长、更薄的现代比例 */
    .tile { 
        width: 5vw; max-width: 60px; 
        height: 10vh; min-height: 90px; 
        background: var(--tile-bg); 
        border-radius: 4px; /* 圆角减小，更显锐利 */
        box-shadow: 2px 4px 10px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05), inset -1px -1px 3px rgba(0,0,0,0.03); 
        display: flex; flex-direction: column; justify-content: center; align-items: center; 
        cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
        border-top: 1px solid #FFF; border-left: 1px solid #FFF; position: relative; 
    }

    /* 交互态：选中 */
    .tile.selected { transform: translateY(-20px); box-shadow: 0 12px 24px rgba(0,0,0,0.1), inset 0 0 0 1px var(--gold); }

    /* ================= 设计核心：极简几何图案 ================= */

    /* 1. 极简万字 / 字牌 (超细字体) */
    .char { font-weight: 200; font-size: clamp(24px, 5vw, 36px); line-height: 1.1; color: var(--ink-dark); }
    .char.red { color: var(--cinnabar); }
    .char-small { font-size: clamp(12px, 2vw, 16px); font-weight: 300; margin-top: 4px; }

    /* 2. 极简筒子 (几何同心圆) */
    .dot-container { display: grid; gap: 8px; justify-items: center; align-items: center; width: 100%; height: 100%; padding: 15%; }
    .dot { width: 14px; height: 14px; border: 1.5px solid var(--ink-dark); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    .dot::after { content: ''; width: 4px; height: 4px; background: var(--ink-dark); border-radius: 50%; } /* 靶心 */
    .dot.red { border-color: var(--cinnabar); }
    .dot.red::after { background: var(--cinnabar); }
    
    /* 1筒特写：大号几何同心射线 */
    .dot-one { width: 36px; height: 36px; border: 1px solid var(--cinnabar); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; }
    .dot-one::before { content: ''; width: 24px; height: 24px; border: 1px dashed var(--gold); border-radius: 50%; position: absolute; }
    .dot-one::after { content: ''; width: 12px; height: 12px; background: var(--cinnabar); border-radius: 50%; }

    /* 3. 极简条子 (胶囊线条) */
    .bamboo-container { display: flex; gap: 6px; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 15%; }
    .bamboo { width: 4px; height: 32px; background-color: var(--jade); border-radius: 4px; position: relative; }
    /* 用极小的切口替代竹节 */
    .bamboo::after { content: ''; position: absolute; top: 50%; left: -1px; right: -1px; height: 2px; background: var(--tile-bg); }

    /* 一鸟的极简几何替代：一个由三角形组成的抽象飞鸟 */
    .bird { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 24px solid var(--jade); position: relative; }
    .bird::after { content: ''; position: absolute; top: 12px; left: -18px; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 10px solid var(--cinnabar); }

</style>
</head>
<body>

    <div class="hand-tiles">
        <div class="tile"><div class="char">二</div><div class="char-small">萬</div></div>
        <div class="tile"><div class="char">三</div><div class="char-small">萬</div></div>
        
        <div class="tile"><div class="dot-one"></div></div> <div class="tile">
            <div class="dot-container" style="grid-template-rows: 1fr 1fr;">
                <div class="dot"></div><div class="dot"></div>
            </div>
        </div> <div class="tile selected">
            <div class="dot-container" style="grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px;">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div> <div class="tile"><div class="bird"></div></div> <div class="tile">
            <div class="bamboo-container"><div class="bamboo"></div><div class="bamboo"></div></div>
        </div> <div class="tile"><div class="char">東</div></div>
        <div class="tile"><div class="char red">中</div></div>
        <div class="tile"><div style="width: 28px; height: 40px; border: 2px solid var(--gold); border-radius: 2px;"></div></div> </div>

    <script>
        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('click', function() {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
    </script>
</body>
</html>
