<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { margin: 0; background: #F9F9F7; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;}
    
    /* 底层：牌局画面 (模拟) */
    .game-layer { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: #ccc; z-index: 1;}

    /* 顶层：结算画面，初始被遮罩完全遮挡 */
    .ink-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(44, 53, 57, 0.95); /* 深邃的墨色背景 */
        backdrop-filter: blur(10px);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: #B8975E;
        font-family: "Noto Serif CJK SC", serif;
        
        /* 核心动效：使用径向渐变作为遮罩，初始大小为0 */
        -webkit-mask-image: radial-gradient(circle at center, black 0%, black 30%, transparent 70%);
        -webkit-mask-size: 0vmax 0vmax;
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        
        /* 动画：遮罩尺寸从 0 放大到足以覆盖全屏 */
        transition: -webkit-mask-size 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        pointer-events: none; /* 未展开时防误触 */
    }

    /* 晕染炸开状态 */
    .ink-layer.active {
        -webkit-mask-size: 300vmax 300vmax; /* 扩大到屏幕对角线以上 */
        pointer-events: auto;
    }
    
    button { position: absolute; bottom: 50px; z-index: 20; padding: 10px 20px; background: #fff; border: 1px solid #ccc; cursor: pointer; }
</style>
</head>
<body>
    <div class="game-layer"><h2>(模拟背后的牌局界面)</h2></div>
    
    <div class="ink-layer" id="resultLayer">
        <h1 style="font-size: 4rem; margin:0; letter-spacing: 20px; text-indent: 20px; color: #9A3B2A;">自摸</h1>
        <p style="font-size: 1.5rem; letter-spacing: 5px;">清一色 · 碰碰胡</p>
    </div>

    <button onclick="document.getElementById('resultLayer').classList.toggle('active')">触发：水墨晕染</button>
</body>
</html>
