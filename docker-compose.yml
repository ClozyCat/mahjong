services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      args:
        MAHJONG_ENABLE_SPECTATOR: ${MAHJONG_ENABLE_SPECTATOR:-false}
    restart: unless-stopped
    environment:
      MAHJONG_DATABASE_URL: ${MAHJONG_DATABASE_URL:-sqlite+pysqlite:////data/mahjong.db}
      MAHJONG_BOT_POLICY: ${MAHJONG_BOT_POLICY:-search}
      MAHJONG_BOT_MODEL_PATH: ${MAHJONG_BOT_MODEL_PATH:-/app/assets/models/mahjong_policy_net.onnx}
      MAHJONG_BOT_NEURAL_WEIGHT: ${MAHJONG_BOT_NEURAL_WEIGHT:-80}
    volumes:
      - mahjong-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        MAHJONG_ENABLE_SPECTATOR: ${MAHJONG_ENABLE_SPECTATOR:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"    # 监听 IPv4 的 localhost
      - "[::1]:${APP_PORT:-80}:80"        # 监听 IPv6 的 localhost

volumes:
  mahjong-data:
