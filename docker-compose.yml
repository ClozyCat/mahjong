services:
  backendmj:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      args:
        ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION:-1.24.2}
    restart: unless-stopped
    environment:
      MAHJONG_DATABASE_URL: ${MAHJONG_DATABASE_URL:-sqlite+pysqlite:////data/mahjong.db}
      MAHJONG_BOT_MODEL_PATH: ${MAHJONG_BOT_MODEL_PATH:-/app/assets/sft/sft.onnx}
      MAHJONG_BOT_SCHUBERT_MODEL_PATH: ${MAHJONG_BOT_SCHUBERT_MODEL_PATH:-/app/assets/sft/sft.onnx}
      MAHJONG_BOT_ANDERSEN_MODEL_PATH: ${MAHJONG_BOT_ANDERSEN_MODEL_PATH:-/app/assets/sft/sft.onnx}
      MAHJONG_BOT_BALZAC_MODEL_PATH: ${MAHJONG_BOT_BALZAC_MODEL_PATH:-/app/assets/sft/sft.onnx}
      MAHJONG_BOT_DICKENS_MODEL_PATH: ${MAHJONG_BOT_DICKENS_MODEL_PATH:-/app/assets/sft/sft.onnx}
    volumes:
      - type: bind
        source: ${MAHJONG_DATA_DIR:-/opt/mahjong-data}
        target: /data
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontendmj:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    restart: unless-stopped
    depends_on:
      backendmj:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
