services:
  mahjong-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    restart: unless-stopped
    environment:
      MAHJONG_DEV_CORS_ORIGINS: https://mj.060889.xyz
      MAHJONG_DATABASE_URL: ${MAHJONG_DATABASE_URL:-sqlite+pysqlite:////data/mahjong.db}
    volumes:
      - mahjong-data:/data
    expose:
      - 127.0.0.1:8899:8000
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web
networks:
  web:
    name: web
    driver: bridge
volumes:
  mahjong-data:
